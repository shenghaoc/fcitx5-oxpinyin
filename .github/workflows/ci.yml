name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fcitx/github-actions@clang-format

  check:
    name: Build and test
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          # fcitx5-chinese-addons is a HARD dependency: punctuation is
          # delegated to its shared punctuation module (getPunctuation),
          # needed at build time (header + Fcitx5Module Punctuation
          # component) and at test time (the harness loads it). chttrans
          # and fullwidth remain optional.
          pacman -Syu --noconfirm base-devel clang cmake ninja git \
            extra-cmake-modules fmt libuv boost \
            libpinyin fcitx5 fcitx5-chinese-addons
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOXPINYIN_USER_DATA_DIR="$(mktemp -d)"
          cmake --build build
          ctest --test-dir build --output-on-failure

  check-cloudpinyin:
    name: Build and test (cloudpinyin ON)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          # ENABLE_CLOUDPINYIN additionally needs the cloudpinyin module's
          # public header and its Fcitx5::Module::CloudPinyin cmake config,
          # plus the runtime module for the harness. This job shares the
          # fcitx5-chinese-addons install with the baseline `check` job (a
          # hard dependency now that punctuation is delegated) and layers the
          # cloud-ON build on top. The cloud-OFF baseline is covered there.
          pacman -Syu --noconfirm base-devel clang cmake ninja git \
            extra-cmake-modules fmt libuv boost \
            libpinyin fcitx5 fcitx5-chinese-addons
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_CLOUDPINYIN=ON \
            -DOXPINYIN_USER_DATA_DIR="$(mktemp -d)"
          cmake --build build
          ctest --test-dir build --output-on-failure
