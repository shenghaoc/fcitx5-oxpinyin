name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# One PR revision at a time: superseded runs are cancelled instead of racing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared build/test invocation; per-job CMake flags ride in job env
  # (CMAKE_FLAGS) and get word-split on purpose below.
  BUILD_TYPE: Release

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fcitx/github-actions@clang-format

  check:
    name: Build and test (gcc, strict warnings as errors)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: ./.github/actions/install-deps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        run: ./.github/scripts/build-test.sh

  check-clang:
    name: Build and test (clang, strict warnings as errors)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: ./.github/actions/install-deps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        env:
          CC: clang
          CXX: clang++
        run: ./.github/scripts/build-test.sh

  check-cloudpinyin:
    name: Build and test (cloudpinyin ON)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
      CMAKE_FLAGS: -DENABLE_CLOUDPINYIN=ON
    steps:
      - uses: ./.github/actions/install-deps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        run: ./.github/scripts/build-test.sh

  check-lua:
    name: Build and test (lua ON)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
      CMAKE_FLAGS: -DENABLE_LUA=ON
    steps:
      - uses: ./.github/actions/install-deps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        run: ./.github/scripts/build-test.sh

  check-sanitizer:
    name: Sanitizers (clang, ASan+UBSan, strict UB)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      CC: clang
      CXX: clang++
      CMAKE_FLAGS: >-
        -DENABLE_SANITIZER=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
    steps:
      - uses: ./.github/actions/install-deps
        with:
          extra: llvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        # llvm-symbolizer is REQUIRED here, not cosmetic: LSan suppression
        # matching resolves frame names through it, and without it the known
        # upstream libpinyin leak resurfaces as unsymbolized noise and fails
        # the job (test/CMakeLists.txt additionally hard-requires it at
        # configure time).
        run: ./.github/scripts/build-test.sh

  static-analysis:
    name: Static analysis (clang-tidy)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: ./.github/actions/install-deps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure (exports compile_commands.json)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: clang-tidy over engine sources
        # .clang-tidy is intentionally narrow (lifetimes/moves/narrowing at
        # the engine C ABI, performance, analyzer) and configured clean;
        # WarningsAsErrors makes any new finding fail this job.
        run: clang-tidy -p build src/oxpinyin.cpp src/englishness.cpp

  fuzz-smoke:
    name: Fuzz smoke test (libFuzzer)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: ./.github/actions/install-deps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with fuzz harnesses
        env:
          CC: clang
          CXX: clang++
          CMAKE_FLAGS: -DENABLE_FUZZ=ON
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DOXPINYIN_USER_DATA_DIR="$(mktemp -d)" $CMAKE_FLAGS
          cmake --build build
      - name: Run corpus smoke + regular suite
        run: ctest --test-dir build --output-on-failure

  package-check:
    name: Package / install validation
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: ./.github/actions/install-deps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install to a DESTDIR staging tree and validate layout
        run: ./.github/scripts/package-check.sh
