name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fcitx/github-actions@clang-format

  check:
    name: Build and test
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          # No fcitx5-chinese-addons: punctuation is internal now, and
          # full-width is delegated to fcitx5's own global fullwidth
          # module. The addon must load with neither installed.
          # sqlite provides both libsqlite3 and the CLI that builds
          # english.db (gawk comes with base-devel).
          pacman -Syu --noconfirm base-devel clang cmake ninja git \
            extra-cmake-modules fmt libuv boost \
            libpinyin fcitx5 sqlite
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOXPINYIN_USER_DATA_DIR="$(mktemp -d)"
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Build and test without English input mode
        run: |
          cmake -B build-noeng -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_ENGLISH_INPUT_MODE=OFF \
            -DOXPINYIN_USER_DATA_DIR="$(mktemp -d)"
          cmake --build build-noeng
          ctest --test-dir build-noeng --output-on-failure
