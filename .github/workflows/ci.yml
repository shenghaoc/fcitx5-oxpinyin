name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# One PR revision at a time: superseded runs are cancelled instead of racing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # Shared archlinux package set. Dependencies install BEFORE checkout (the
  # container has no git, and actions/checkout needs one), so this cannot be
  # a local composite action -- `uses: ./...` only resolves after checkout.
  # fcitx5-chinese-addons is a HARD dependency everywhere: punctuation is
  # delegated to its shared punctuation module, needed at build time (header
  # + Fcitx5Module Punctuation component) and at test time (the harness
  # loads it).
  DEP_PACKAGES: >-
    base-devel clang cmake ninja git extra-cmake-modules
    fmt libuv boost libpinyin fcitx5 fcitx5-chinese-addons

jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fcitx/github-actions@clang-format

  check:
    name: Build and test (gcc, strict warnings as errors)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # Package lists arrive as multi-word strings; the expansion
          # word-splits on purpose.
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm $DEP_PACKAGES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        run: ./.github/scripts/build-test.sh

  check-clang:
    name: Build and test (clang, strict warnings as errors)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Install dependencies
        run: |
          # Package lists arrive as multi-word strings; the expansion
          # word-splits on purpose.
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm $DEP_PACKAGES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        run: ./.github/scripts/build-test.sh

  check-cloudpinyin:
    name: Build and test (cloudpinyin ON)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
      CMAKE_FLAGS: -DENABLE_CLOUDPINYIN=ON
    steps:
      - name: Install dependencies
        run: |
          # Package lists arrive as multi-word strings; the expansion
          # word-splits on purpose.
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm $DEP_PACKAGES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        run: ./.github/scripts/build-test.sh

  check-lua:
    name: Build and test (lua ON)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
      CMAKE_FLAGS: -DENABLE_LUA=ON
      EXTRA_PACKAGES: fcitx5-lua
    steps:
      - name: Install dependencies
        # ENABLE_LUA additionally needs fcitx5-lua: the LuaAddonLoader
        # module's public header and its cmake config at build time, plus
        # the runtime modules for the harness.
        run: |
          # Package lists arrive as multi-word strings; the expansion
          # word-splits on purpose.
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm $DEP_PACKAGES $EXTRA_PACKAGES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        run: ./.github/scripts/build-test.sh

  check-sanitizer:
    name: Sanitizers (clang, ASan+UBSan, strict UB)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      CC: clang
      CXX: clang++
      CMAKE_FLAGS: >-
        -DENABLE_SANITIZER=ON
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
      EXTRA_PACKAGES: llvm
    steps:
      - name: Install dependencies
        # llvm-symbolizer is REQUIRED here, not cosmetic: LSan suppression
        # matching resolves frame names through it, and without it the known
        # upstream libpinyin leak resurfaces as unsymbolized noise and fails
        # the job (test/CMakeLists.txt additionally hard-requires it at
        # configure time).
        run: |
          # Package lists arrive as multi-word strings; the expansion
          # word-splits on purpose.
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm $DEP_PACKAGES $EXTRA_PACKAGES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure, build, test
        run: ./.github/scripts/build-test.sh

  static-analysis:
    name: Static analysis (clang-tidy)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # Package lists arrive as multi-word strings; the expansion
          # word-splits on purpose.
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm $DEP_PACKAGES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure (exports compile_commands.json)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: clang-tidy over engine sources
        # .clang-tidy is intentionally narrow (lifetimes/moves/narrowing at
        # the engine C ABI, performance, analyzer) and configured clean;
        # WarningsAsErrors makes any new finding fail this job.
        run: clang-tidy -p build src/oxpinyin.cpp src/englishness.cpp

  fuzz-smoke:
    name: Fuzz smoke test (libFuzzer)
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      CC: clang
      CXX: clang++
      CMAKE_FLAGS: -DENABLE_FUZZ=ON
      EXTRA_PACKAGES: llvm
    steps:
      - name: Install dependencies
        run: |
          # Package lists arrive as multi-word strings; the expansion
          # word-splits on purpose.
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm $DEP_PACKAGES $EXTRA_PACKAGES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with fuzz harnesses
        run: |
          # Only CMAKE_FLAGS stays unquoted (per-job flag list splits here);
          # BUILD_TYPE is a single token.
          # shellcheck disable=SC2086
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DOXPINYIN_USER_DATA_DIR="$(mktemp -d)" $CMAKE_FLAGS
          cmake --build build
      - name: Run corpus smoke + regular suite
        run: ctest --test-dir build --output-on-failure

  package-check:
    name: Package / install validation
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          # Package lists arrive as multi-word strings; the expansion
          # word-splits on purpose.
          # shellcheck disable=SC2086
          pacman -Syu --noconfirm $DEP_PACKAGES
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install to a DESTDIR staging tree and validate layout
        run: ./.github/scripts/package-check.sh
